name: Windows installer

# The Windows installer (E42): built with Inno Setup on a clean Windows runner, then installed,
# upgraded, rolled back and removed for real by tools/installer/test-install.ps1 (the runner is an
# administrator). On a version tag the installer and its SHA256SUMS.txt are attached to the
# GitHub release of that tag. The installer is not code-signed (docs/installation.md says how to
# check the checksum instead).
#
# The test instance has its own service name, folders and port, built with build.ps1 -Instance test:
#   A  the version in package.json         installed first
#   B  the same code as version +0.0.1     the upgrade, which must keep the data
#   C  as B, version +0.0.2, with a migration that fails on purpose (-BrokenMigration): the upgrade
#      to it must roll back to B with B's data
# A is also run over B to prove an older installer is refused.
#
# The test also covers the wave 23 security review (S2 to S4): a data folder and a program folder
# made in advance and owned by another account are refused before anything is copied; the program
# folder (installed outside Program Files here, where C:\ would let every signed-in user change it)
# and the data folder get their own locked permissions, kept across the upgrade; NODE_OPTIONS in
# grc.env is ignored; the service has no SeImpersonatePrivilege; setup.log is outside the service's
# reach; a reinstallation over a data folder holding a junction is refused; and uninstalling with
# /REMOVEDATA=1 deletes a junction in the data folder without deleting what it points to.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'deploy/windows/**'
      - 'tools/installer/**'
      - 'tools/node-version.txt'
      - 'tools/install-node.ps1'
      - 'server/**'
      - 'shared/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'deploy/windows/**'
      - 'tools/installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Inno Setup 6.7.4 from its author's GitHub releases, checked against this SHA-256 before use.
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C

jobs:
  installer:
    name: Build, install, upgrade, roll back, uninstall (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # Windows PowerShell 5.1, which every supported Windows has, as the installer uses.
        shell: powershell
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the pinned Node.js into .tools\node (checksum verified)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\install-node.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-node.ps1 failed ($LASTEXITCODE)" }

      - name: Install the packages (for the web build)
        run: |
          $env:Path = "$PWD\.tools\node;$env:Path"
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Install Inno Setup (checksum verified)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $exe -UseBasicParsing
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/PORTABLE=1', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install ($($p.ExitCode))" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Versions
        id: v
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $n = $v.Split('-')[0].Split('.')
          $b = "$($n[0]).$($n[1]).$([int]$n[2] + 1)"
          $c = "$($n[0]).$($n[1]).$([int]$n[2] + 2)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $v" }
          "a=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "b=$b" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "c=$c" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release $v; test upgrade $b; broken upgrade $c"

      - name: Build the release installer
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\installer\build.ps1 -OutDir "$env:RUNNER_TEMP\release"
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 failed' }

      - name: Build the three test installers
        run: |
          $web = "$env:RUNNER_TEMP\release\stage\app\dist\web"
          $out = "$env:RUNNER_TEMP\test"
          $common = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\tools\installer\build.ps1', '-OutDir', $out, '-Instance', 'test', '-WebDist', $web)
          powershell @common -Version '${{ steps.v.outputs.a }}'
          if ($LASTEXITCODE -ne 0) { throw 'build A failed' }
          powershell @common -Version '${{ steps.v.outputs.b }}'
          if ($LASTEXITCODE -ne 0) { throw 'build B failed' }
          powershell @common -Version '${{ steps.v.outputs.c }}' -BrokenMigration
          if ($LASTEXITCODE -ne 0) { throw 'build C failed' }

      - name: Refuse planted folders, install outside Program Files, sign in, back up, upgrade, refuse a downgrade, roll back, uninstall, reinstall, remove the data
        run: |
          $out = "$env:RUNNER_TEMP\test"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\installer\test-install.ps1 `
            -Installer "$out\SandpiperGRC-test-Setup-${{ steps.v.outputs.a }}.exe" `
            -Upgrade "$out\SandpiperGRC-test-Setup-${{ steps.v.outputs.b }}.exe" `
            -Broken "$out\SandpiperGRC-test-Setup-${{ steps.v.outputs.c }}.exe" `
            -Instance test -Port 8206 -InstallDir 'C:\SandpiperGRC-test' -ReinstallDir "$env:ProgramFiles\Sandpiper GRC test" `
            -LogDir "$env:RUNNER_TEMP\installer-logs"
          if ($LASTEXITCODE -ne 0) { throw 'test-install.ps1 failed' }

      - name: Logs of the test installation
        if: always()
        run: |
          $root = "$env:ProgramData\SandpiperGRC-test"
          foreach ($f in @(Get-Item "$root\setup.log" -ErrorAction SilentlyContinue) + @(Get-ChildItem "$root\logs" -File -ErrorAction SilentlyContinue)) { Write-Host "--- $($f.FullName)"; Get-Content $f.FullName -Tail 80 }
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\installer-logs" -File -ErrorAction SilentlyContinue) { Write-Host "--- $($f.FullName)"; Get-Content $f.FullName -Tail 40 }

      - name: Keep the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            ${{ runner.temp }}\release\SandpiperGRC-Setup-*.exe
            ${{ runner.temp }}\release\SHA256SUMS.txt
          retention-days: 14

  release:
    name: Attach the installer to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the tested installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: installer

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd installer
          sha256sum -c SHA256SUMS.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "See docs/roadmap for what changed."
          gh release upload "$TAG" SandpiperGRC-Setup-*.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
