name: CI

# Type check, tests and a production build of the web application, on every push and
# pull request. Nothing here needs the private seed/ folder or any secret.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Tests use an in-memory database and never read seed/; point at a folder that does not exist to prove it.
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The major version is pinned in one place, shared with tools/install-node.ps1.
          node-version-file: tools/node-version.txt

      - name: Install packages
        shell: bash
        # `npm ci` installs exactly what the lock file says. Until the lock file is
        # committed (it is git-ignored today) fall back to `npm install`.
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type check (server and web)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the web application
        run: npm run build
