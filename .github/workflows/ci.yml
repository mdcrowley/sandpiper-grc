name: CI

# Checks what a change needs (wave 27). The first job, "What changed", compares the commit with the
# merge base of a pull request's target branch, or with the commit before a push (the merge base
# with main for the first push of a branch or after a force push), and works out from the import
# graph and the area map (tools/ci/plan.mjs) which unit tests, browser suites and jobs are needed.
# The run page's summary says which areas were affected and what was skipped. Everything runs:
# nightly, on a version tag, on a manual run with "full" ticked, and when this workflow or the
# selection rules (tools/ci) change.
#
# Jobs: the typecheck and the chosen unit tests on Linux (in parts) and Windows, and through the
# PostgreSQL server driver (pglite-socket and PostgreSQL 17); installation on macOS and Linux with
# tools/install-node.sh and grc.sh, and on Windows with tools/install-node.ps1 and grc.ps1 (a smoke
# check of the commands, not the tests again); the container image, built and started, and
# compose.yaml with both databases; the browser suites, shared out over several machines and, for
# an ordinary change, only over the affected areas' pages; the accessibility audit; the API client
# and the mobile app. On pushes to main and on version tags, once the checks pass, the image is
# published to ghcr.io for amd64 and arm64, with a software bill of materials and signed build
# provenance. The dependency audit fails only on a vulnerability someone can fix; a released
# migration may never change. Nothing here needs the private seed/ folder or any secret other than
# the built-in token.
#
# Branch protection: require only "CI result" (the last job). It passes when every job that ran
# passed and the skipped ones were not needed; the other jobs' names change with their parts.
on:
  push:
  pull_request:
  schedule:
    # Every night at 03:17 UTC: everything, so nothing goes untested for long.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run everything, not only what the changes need
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or pull request cancels the run it makes out of date.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      base: ${{ steps.plan.outputs.base }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unit: ${{ steps.plan.outputs.unit }}
      unit_any: ${{ steps.plan.outputs.unit_any }}
      database_server: ${{ steps.plan.outputs.database_server }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_any: ${{ steps.plan.outputs.browser_any }}
      browser_args: ${{ steps.plan.outputs.browser_args }}
      browser_postgres: ${{ steps.plan.outputs.browser_postgres }}
      areas: ${{ steps.plan.outputs.areas }}
      accessibility: ${{ steps.plan.outputs.accessibility }}
      web_build: ${{ steps.plan.outputs.web_build }}
      container: ${{ steps.plan.outputs.container }}
      install: ${{ steps.plan.outputs.install }}
      mobile: ${{ steps.plan.outputs.mobile }}
      api_client: ${{ steps.plan.outputs.api_client }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - name: Check out (with history, to compare)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt

      - name: Work out what the change needs
        id: plan
        # Plain Node, no packages: tools/ci/github.mjs writes the outputs and the run summary.
        run: node tools/ci/github.mjs

  check:
    name: Typecheck, audit and web build
    needs: changes
    if: needs.changes.outputs.typecheck == 'true' || needs.changes.outputs.audit == 'true' || needs.changes.outputs.web_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The major version is pinned in one place, shared with tools/install-node.ps1.
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        # Installs exactly what the committed lock file says.
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        # Fails on a known high or critical vulnerability in a production package when a fixed
        # version exists; one that nobody can fix yet is listed without failing (E16-13). Exit 3
        # means the registry could not be reached, which is a warning here.
        if: needs.changes.outputs.audit == 'true'
        shell: bash
        run: |
          code=0
          npx tsx server/src/cli.ts audit-deps || code=$?
          if [ "$code" = 3 ]; then echo "::warning::The dependency audit could not reach the npm registry."; exit 0; fi
          exit $code

      - name: Keep the typecheck's incremental state
        if: needs.changes.outputs.typecheck == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'server/tsconfig.json', 'web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'server/tsconfig.json', 'web/tsconfig.json') }}-

      - name: Type check (server and web)
        if: needs.changes.outputs.typecheck == 'true'
        run: |
          npx tsc --noEmit -p server --incremental --tsBuildInfoFile node_modules/.cache/tsc/server.tsbuildinfo
          npx tsc --noEmit -p web --incremental --tsBuildInfoFile node_modules/.cache/tsc/web.tsbuildinfo

      - name: Build the web application
        if: needs.changes.outputs.web_build == 'true'
        run: npm run build
        env:
          GRC_WEB_DIST: ${{ github.workspace }}/e2e-web

      - name: Keep the web build for the browser jobs
        if: needs.changes.outputs.web_build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: e2e-web
          retention-days: 2

  unit:
    # The chosen unit tests (every test on a full run), shared out with Vitest's --shard.
    name: Unit tests (${{ matrix.os }}, part ${{ matrix.part }} of ${{ matrix.of }})
    needs: changes
    if: needs.changes.outputs.unit_any == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit) }}
    env:
      # Tests use an in-memory database and never read seed/; point at a folder that does not exist to prove it.
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
    steps:
      - name: Check out (with history, to compare)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Keep test timings and the migrated template database
        # Vitest starts the slowest files first when it knows their times (node_modules/.vite);
        # the template is remade when a migration changes (server/src/test/global-setup.ts).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.vite/vitest
            node_modules/.cache/grc-test-db
          key: vitest-${{ runner.os }}-${{ hashFiles('**/migrations/*.sql', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: vitest-${{ runner.os }}-

      - name: Tests
        shell: bash
        env:
          BASE: ${{ needs.changes.outputs.base }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$(node tools/ci/github.mjs --unit-list "$RUNNER_TEMP/tests.txt")" != all ]; then export GRC_TEST_LIST="$RUNNER_TEMP/tests.txt"; fi
          npx vitest run --passWithNoTests --shard=${{ matrix.part }}/${{ matrix.of }}

  # The chosen tests through the PostgreSQL server driver (pg), so both drivers stay
  # interchangeable (E16-05):
  # - pglite-socket: every test database is an embedded PostgreSQL served over the wire protocol
  # - postgres-17: every test database is a fresh database on a real PostgreSQL server
  database-server:
    name: Tests on a database server (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.database_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [pglite-socket, postgres-17]
    services:
      postgres:
        # Started for both legs (a service cannot be made conditional); only postgres-17 uses it.
        image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc-ci-only
          POSTGRES_DB: grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
      GRC_DATABASE_POOL_MAX: '5'
    steps:
      - name: Check out (with history, to compare)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: The tests to run
        env:
          BASE: ${{ needs.changes.outputs.base }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$(node tools/ci/github.mjs --unit-list "$RUNNER_TEMP/tests.txt")" != all ]; then echo "GRC_TEST_LIST=$RUNNER_TEMP/tests.txt" >> "$GITHUB_ENV"; fi

      - name: Tests through the wire protocol (pglite-socket)
        if: matrix.target == 'pglite-socket'
        env:
          GRC_TEST_DATABASE: pg
        run: npm test

      - name: Tests on PostgreSQL 17
        if: matrix.target == 'postgres-17'
        env:
          # The account creates and drops one database per test application.
          GRC_TEST_DATABASE_URL: postgres://grc:grc-ci-only@127.0.0.1:5432/grc
        run: npm test

      - name: Least-privilege database role (owner migrates, the server runs as grc_app)
        # E16-31 on a real server: the owner account creates the schema and grants grc_app, which
        # may read and write rows but cannot alter the schema or the audit log's trigger.
        if: matrix.target == 'postgres-17'
        env:
          PGHOST: 127.0.0.1
          PGUSER: grc
          PGPASSWORD: grc-ci-only
          GRC_DATA_DIR: ${{ runner.temp }}/grc-lp
          GRC_PORT: '8171'
          GRC_DATABASE_SSL: 'off'
          GRC_DATABASE_URL: postgres://grc_app:app-ci-only@127.0.0.1:5432/grc_lp
        run: |
          set -eu
          psql -d grc -v ON_ERROR_STOP=1 -c "create database grc_lp" -c "create role grc_app login password 'app-ci-only'"
          GRC_DATABASE_MIGRATE_URL=postgres://grc:grc-ci-only@127.0.0.1:5432/grc_lp npx tsx server/src/cli.ts migrate
          npx tsx server/src/main.ts > "$RUNNER_TEMP/lp.out" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8171/api/health && break; sleep 2; done
          curl -fsS -X POST -H 'content-type: application/json' -H 'x-grc-csrf: 1' \
            -d '{"username":"admin","email":"admin@example.test","displayName":"Administrator","password":"ci-only-Passw0rd-long-enough"}' \
            http://127.0.0.1:8171/api/setup > /dev/null
          if PGUSER=grc_app PGPASSWORD=app-ci-only psql -d grc_lp -c "drop trigger audit_events_no_change on audit_events"; then echo "grc_app could drop the audit trigger"; exit 1; fi
          if PGUSER=grc_app PGPASSWORD=app-ci-only psql -d grc_lp -c "delete from audit_events"; then echo "grc_app could delete audit events"; exit 1; fi
          cat "$RUNNER_TEMP/lp.out"
          if grep -i 'permission denied\|must be owner' "$GRC_DATA_DIR/logs/grc.log"; then echo "the server needed owner rights at run time"; exit 1; fi
          touch "$GRC_DATA_DIR/grc.stop"

  # A migration that is part of a release must never change (E16-20): installations have applied
  # it and would not run it again. Compared with the newest version tag; before the first release
  # there is nothing to compare with.
  released-migrations:
    name: Released migrations unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare with the newest release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No release tag yet, so no migration is released."; exit 0; fi
          changed=$(git diff --name-only --diff-filter=MDR "$tag" HEAD -- ':(glob)server/src/**/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Migrations released in $tag were changed, renamed or deleted. Put the change in a new migration instead:"
            echo "$changed"
            exit 1
          fi
          echo "Every migration released in $tag is unchanged."

  # macOS and Linux installation as a person would do it: the pinned Node.js fetched by
  # tools/install-node.sh, then grc.sh for everything (the counterpart of grc.ps1). A smoke check of
  # the commands, not the tests again (those run in "Unit tests"). When the install scripts, grc.sh,
  # the operations code or the packages change, and nightly.
  unix-install:
    name: Install and run with grc.sh (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
      GRC_DATA_DIR: ${{ github.workspace }}/../grc-data
      GRC_BACKUP_DIR: ${{ github.workspace }}/../grc-backups
      GRC_PORT: '8170'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the pinned Node.js into .tools/node (checksum verified)
        run: ./tools/install-node.sh

      - name: Install packages
        run: ./grc.sh install

      - name: grc ci works (plan only; the tests run in "Unit tests")
        run: ./grc.sh ci --plan

      - name: Start, health, sample data, backup, stop
        run: |
          set -eu
          ./grc.sh start
          ./grc.sh health
          ./grc.sh seed --profile dev
          ./grc.sh backup --prune 2
          ./grc.sh verify-backup
          ./grc.sh status
          ./grc.sh version
          ./grc.sh logs --lines 20
          test -s "$GRC_DATA_DIR/logs/grc.log"
          ./grc.sh stop
          if ./grc.sh health; then echo "still answering after stop"; exit 1; fi

      - name: Service definitions are valid (systemd unit, launchd agent)
        run: |
          set -eu
          if [ "$(uname -s)" = Linux ]; then
            ./grc.sh service print > "$RUNNER_TEMP/sandpiper-grc.service"
            systemd-analyze verify "$RUNNER_TEMP/sandpiper-grc.service"
          else
            ./grc.sh service print > "$RUNNER_TEMP/org.sandpiper-grc.server.plist"
            plutil -lint "$RUNNER_TEMP/org.sandpiper-grc.server.plist" deploy/launchd/*.plist
          fi

      - name: User service on a real systemd or launchd (install, restart, crash, stop, remove)
        # E16-35: ./grc.sh service install as a person would run it, under the runner's own service
        # manager. GitHub's Linux runner has no login session, so lingering starts the user's systemd
        # manager first (on a desktop or a server with a session it is already there).
        timeout-minutes: 8
        run: |
          set -eu
          if [ "$(uname -s)" = Linux ]; then
            sudo loginctl enable-linger "$(id -un)"
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
            systemctl --user is-system-running || true
          fi
          pid() { tr -d '[:space:]' < "$GRC_DATA_DIR/grc.pid"; }
          wait_healthy() { for _ in $(seq 1 90); do ./grc.sh health > /dev/null && return 0; sleep 1; done; ./grc.sh service status || true; return 1; }

          ./grc.sh service install
          ./grc.sh service status
          wait_healthy
          if [ "$(uname -s)" = Linux ]; then systemctl --user is-active sandpiper-grc.service; systemctl --user is-enabled sandpiper-grc.service
          else launchctl print "gui/$(id -u)/org.sandpiper-grc.server" | grep -q 'state = running'; fi

          # ./grc.sh restart stops cleanly and starts it again through the service manager.
          first=$(pid)
          ./grc.sh restart
          wait_healthy
          [ "$(pid)" != "$first" ] || { echo "restart kept the same process"; exit 1; }

          # A command that stops the server for its work starts the service again afterwards.
          ./grc.sh backup --prune 2
          wait_healthy
          ./grc.sh status

          # A crash is restarted by the service manager by itself.
          crashed=$(pid)
          kill -9 "$crashed"
          for _ in $(seq 1 90); do
            if [ -f "$GRC_DATA_DIR/grc.pid" ] && [ "$(pid)" != "$crashed" ] && ./grc.sh health > /dev/null; then break; fi
            sleep 1
          done
          ./grc.sh health
          [ "$(pid)" != "$crashed" ] || { echo "the service manager did not restart the server after a crash"; exit 1; }

          # A clean stop is not restarted.
          ./grc.sh stop
          sleep 12
          if ./grc.sh health; then echo "the service manager restarted a clean stop"; exit 1; fi

          ./grc.sh service remove
          if [ "$(uname -s)" = Linux ]; then test ! -e "$HOME/.config/systemd/user/sandpiper-grc.service"
          else test ! -e "$HOME/Library/LaunchAgents/org.sandpiper-grc.server.plist"; fi
          if ./grc.sh health; then echo "still answering after the service was removed"; exit 1; fi

      - name: Remove the user service after a failure
        if: failure()
        run: ./grc.sh service remove || true

      - name: Server logs
        if: failure()
        run: ./grc.sh logs --lines 200 || true

  # Windows installation as a person would do it (E17-10), on a clean runner: the pinned Node.js
  # fetched by tools/install-node.ps1, then grc.ps1 for everything, in Windows PowerShell 5.1
  # (powershell.exe, which every Windows has) rather than the runner's PowerShell 7. Each command
  # runs as its own powershell.exe -File process, as typed in a window, so its exit code counts.
  windows-install:
    name: Install and run with grc.ps1 (windows-latest)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    env:
      GRC_SEED_DIR: ${{ github.workspace }}\no-seed-folder
      GRC_DATA_DIR: ${{ github.workspace }}\..\grc-data
      GRC_BACKUP_DIR: ${{ github.workspace }}\..\grc-backups
      GRC_PORT: '8171'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nothing is installed yet
        run: |
          if (Test-Path .tools\node\node.exe) { throw '.tools\node is already there' }
          if (Test-Path node_modules) { throw 'node_modules is already there' }
          # grc.ps1 refuses to run until the portable Node.js is in place.
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 health
          if ($LASTEXITCODE -eq 0) { throw 'grc.ps1 ran without .tools\node' }
          exit 0

      - name: Fetch the pinned Node.js into .tools\node (checksum verified)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\install-node.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-node.ps1 failed ($LASTEXITCODE)" }
          $want = (Get-Content tools\node-version.txt -TotalCount 1).Trim()
          $have = & .\.tools\node\node.exe --version
          if ($have -notlike "v$want.*") { throw "expected Node.js $want, found $have" }
          # A second run changes nothing.
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\install-node.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-node.ps1 (second run) failed ($LASTEXITCODE)" }

      - name: Install packages (installation.md, Windows step 2)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 install
          if ($LASTEXITCODE -ne 0) { throw "grc.ps1 install failed ($LASTEXITCODE)" }

      - name: grc ci works (plan only; the tests run in "Unit tests")
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 ci -Plan
          if ($LASTEXITCODE -ne 0) { throw "grc.ps1 ci -Plan failed ($LASTEXITCODE)" }

      - name: Start, health, sample data, backup, stop
        run: |
          function grc { powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 @args; if ($LASTEXITCODE -ne 0) { throw "grc.ps1 $args failed ($LASTEXITCODE)" } }
          grc start
          grc health
          if (-not (Test-Path "$env:GRC_DATA_DIR\grc.pid")) { throw 'no grc.pid in GRC_DATA_DIR' }
          grc seed -Profile dev
          grc health
          grc backup -Prune 2
          grc verify-backup
          grc backups
          grc status
          grc version
          grc logs -Lines 20
          if ((Get-Item "$env:GRC_DATA_DIR\logs\grc.log").Length -eq 0) { throw 'the server log is empty' }
          grc stop
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 health
          if ($LASTEXITCODE -eq 0) { throw 'still answering after stop' }
          exit 0

      - name: Daily backup as a Windows scheduled task (schedule, run once, remove)
        # The per-user task needs no administrator rights. It is run once by hand here rather than
        # waiting for its time; it must leave a backup labeled "scheduled" and a line in its log.
        timeout-minutes: 8
        run: |
          function grc { powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 @args; if ($LASTEXITCODE -ne 0) { throw "grc.ps1 $args failed ($LASTEXITCODE)" } }
          grc start
          grc schedule-backup -At 03:00 -Prune 3
          $task = Get-ScheduledTask | Where-Object { $_.TaskName -like 'Sandpiper GRC backup (*' }
          if (-not $task) { throw 'the scheduled task was not created' }
          $task.Actions | Format-List Execute, Arguments, WorkingDirectory
          if ($task.Actions[0].Arguments -notlike "*GRC_DATA_DIR*") { throw 'the task does not carry GRC_DATA_DIR' }
          grc status
          $log = Join-Path $env:GRC_BACKUP_DIR 'scheduled-backup.log'
          Start-ScheduledTask -TaskName $task.TaskName
          foreach ($i in 1..150) { if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) { break }; Start-Sleep -Seconds 2 }
          Get-ScheduledTaskInfo -TaskName $task.TaskName | Format-List LastRunTime, LastTaskResult
          if (-not (Test-Path $log)) { throw 'the scheduled task did not run (no scheduled-backup.log)' }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern '  exit 0  ' -Quiet)) { throw 'the scheduled backup failed' }
          $scheduled = Get-ChildItem $env:GRC_BACKUP_DIR -Directory | Where-Object { (Test-Path "$($_.FullName)\manifest.json") -and ((Get-Content "$($_.FullName)\manifest.json" -Raw) -match '"scheduled"') }
          if (-not $scheduled) { throw 'no backup labeled scheduled' }
          # The task stops the server for the backup and starts it again.
          foreach ($i in 1..60) { powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 health | Out-Null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 1 }
          grc health
          grc unschedule-backup
          if (Get-ScheduledTask | Where-Object { $_.TaskName -like 'Sandpiper GRC backup (*' }) { throw 'the task is still there' }
          grc stop

      - name: Remove the scheduled task and stop the server after a failure
        if: failure()
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 unschedule-backup
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 stop
          exit 0

      - name: Server logs
        if: failure()
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\grc.ps1 logs -Lines 200
          if (Test-Path "$env:GRC_DATA_DIR\server.log.err") { Get-Content "$env:GRC_DATA_DIR\server.log.err" -Tail 50 }
          exit 0

  # Builds the container image and proves it starts and answers its health check (E16-06), then
  # runs compose.yaml as the quick start describes, with the embedded database and with PostgreSQL.
  # When the image, compose files, packages or start-up change; nightly and on tags.
  container:
    name: Container image and compose
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned base image matches tools/node-version.txt
        run: |
          set -eu
          major=$(head -n 1 tools/node-version.txt | tr -d '[:space:]')
          # Every FROM line names node:<major>-bookworm-slim pinned by digest.
          if grep -E '^FROM ' Dockerfile | grep -vqE "node:${major}-bookworm-slim@sha256:[0-9a-f]{64} "; then
            echo "Dockerfile: every FROM must be node:${major}-bookworm-slim@sha256:<digest>"; grep -E '^FROM ' Dockerfile; exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: sandpiper-grc:ci
          build-args: |
            GRC_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=max

      - name: Only the application is in the image
        run: |
          set -eu
          # /app holds exactly these; anything else (data, seed files, notes, tools) is a leak.
          top=$(docker run --rm --entrypoint sh sandpiper-grc:ci -c 'ls -A /app' | tr '\n' ' ')
          [ "$top" = "deploy dist node_modules package.json server shared " ] || { echo "Unexpected /app contents: $top"; exit 1; }
          found=$(docker run --rm --entrypoint sh sandpiper-grc:ci -c '
            find /app/server /app/shared -name "*.test.ts" 2>/dev/null
            find /var/lib/sandpiper /var/lib/sandpiper-key -mindepth 1 2>/dev/null
            find /app -path /app/node_modules -prune -o \( -name "*.pem" -o -name "*.key" -o -name ".env*" \) -print 2>/dev/null
          ' || true)
          if [ -n "$found" ]; then echo "Unexpected files in the image:"; echo "$found"; exit 1; fi

      - name: Start (embedded database, read-only root filesystem)
        run: |
          docker run -d --name grc --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e GRC_ALLOW_INSECURE=1 -v grc-ci-data:/var/lib/sandpiper -v grc-ci-key:/var/lib/sandpiper-key \
            -p 127.0.0.1:8080:8080 sandpiper-grc:ci

      - name: Health check answers
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'; then echo "health ok"; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' grc)" != "true" ]; then docker logs grc; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root"' || { echo "web application not served"; exit 1; }
          # The image's own HEALTHCHECK must turn healthy too.
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' grc)" = healthy ] && break
            sleep 3
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' grc)" = healthy ] || { docker inspect --format '{{json .State.Health}}' grc; exit 1; }
          # The secret key was generated in its own volume, not in the data volume.
          docker exec grc sh -c 'test -s /var/lib/sandpiper-key/secret.key && ! ls /var/lib/sandpiper/*.key /var/lib/sandpiper/data/*.key 2>/dev/null'
          docker exec grc grc status
          # The version and commit, and the server's own log in the data volume.
          docker exec grc grc version | grep -q "${{ github.sha }}"
          docker exec grc grc logs --lines 5
          docker logs grc 2>&1 | grep -q '"msg":"Sandpiper GRC'

      - name: Refuses plain HTTP on every interface without GRC_ALLOW_INSECURE
        run: |
          if docker run --rm sandpiper-grc:ci; then echo "should have refused"; exit 1; fi
          docker run --rm sandpiper-grc:ci 2>&1 | grep -q 'Refusing to serve plain HTTP'

      - name: Stops cleanly
        if: always()
        run: |
          docker logs grc || true
          docker stop -t 30 grc || true
          docker rm grc || true

      - name: Compose quick start (embedded database), setup and sample data
        env:
          GRC_IMAGE: sandpiper-grc:ci
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 180
          curl -fsS -X POST -H 'content-type: application/json' -H 'x-grc-csrf: 1' \
            -d '{"username":"admin","email":"admin@example.test","displayName":"Administrator","password":"ci-only-Passw0rd-long-enough"}' \
            http://127.0.0.1:8080/api/setup > /dev/null
          docker compose stop app
          docker compose run --rm --no-deps app grc seed --profile dev
          docker compose up -d --wait --wait-timeout 180
          docker compose exec app grc status
          # One process per data folder (OP-06): a command in a second container beside the running
          # server is refused before it opens the database.
          if docker compose run --rm --no-deps app grc seed --profile dev > lock.log 2>&1; then
            cat lock.log; echo 'a second process opened the data folder beside the server'; exit 1
          fi
          grep -q 'is using this data folder' lock.log
          docker compose stop app
          docker compose run --rm --no-deps app grc backup
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/api/ready | grep -q '"database":"ok"'
          docker compose down -v

      - name: Compose with PostgreSQL
        env:
          GRC_IMAGE: sandpiper-grc:ci
        run: |
          set -eu
          openssl rand -hex 24 > deploy/secrets/db_password.txt
          docker compose -f compose.yaml -f compose.postgres.yaml up -d --wait --wait-timeout 240
          docker compose -f compose.yaml -f compose.postgres.yaml logs app | grep -q 'PostgreSQL server'
          # The application runs as the least-privilege role, not the database owner (SP-05).
          docker compose -f compose.yaml -f compose.postgres.yaml logs app | grep -Eq 'run-time role .{0,2}grc_app.{0,2} granted'
          docker compose -f compose.yaml -f compose.postgres.yaml logs app | grep -q 'postgres://grc_app@db:5432/grc'
          curl -fsS http://127.0.0.1:8080/api/ready | grep -q '"database":"ok"'
          docker compose -f compose.yaml -f compose.postgres.yaml down -v

      - name: Compose logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.postgres.yaml logs || true

  # Publishes the image for linux/amd64 and linux/arm64 to the GitHub Container Registry, once the
  # checks have passed: "edge" for every push to main; x.y.z, x.y and latest for a version tag vX.Y.Z.
  publish:
    name: Publish the container image
    needs: [result]
    if: always() && needs.result.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Signed build provenance (attestations), recorded with GitHub's own signing service.
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned base image matches tools/node-version.txt
        run: |
          set -eu
          major=$(head -n 1 tools/node-version.txt | tr -d '[:space:]')
          # Every FROM line names node:<major>-bookworm-slim pinned by digest.
          if grep -E '^FROM ' Dockerfile | grep -vqE "node:${major}-bookworm-slim@sha256:[0-9a-f]{64} "; then
            echo "Dockerfile: every FROM must be node:${major}-bookworm-slim@sha256:<digest>"; grep -E '^FROM ' Dockerfile; exit 1
          fi

      - name: Set up QEMU (to build for arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Sandpiper GRC
            org.opencontainers.image.description=Governance, risk and compliance for transit organizations
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=Governance, risk and compliance for transit organizations
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A software bill of materials and full build provenance, attached to the image.
          sbom: true
          provenance: mode=max
          build-args: |
            GRC_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  browser:
    # The browser suites, shared out over several machines (tools/e2e/run.mjs --shard, by the
    # minutes in tools/e2e/suite-map.mjs). For an ordinary change only the suites of the affected
    # areas run, and the tours over every page (smoke, roles, record journeys, dialogs, keyboard,
    # features off) visit only the affected areas' pages, plus sign-in and the overview.
    name: Browser tests (part ${{ matrix.part }} of ${{ matrix.of }})
    needs: [changes, check]
    if: needs.changes.outputs.browser_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser) }}
    steps:
      - name: Check out (with history, to compare)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Fetch the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: e2e-web

      - name: Browser tests
        run: npm run test:e2e -- ${{ needs.changes.outputs.browser_args }} --shard ${{ matrix.part }}/${{ matrix.of }}
        env:
          E2E_WEB_DIST: ${{ github.workspace }}/e2e-web

      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-output-${{ matrix.part }}
          path: tools/e2e/out

  browser-postgres:
    # Some suites again on a PostgreSQL server instead of the embedded database (E40-08):
    # tools/e2e creates a fresh database per run from E2E_DATABASE_URL. On a full run, and when
    # the database code, the operations code or a migration changes.
    name: Browser tests (PostgreSQL)
    needs: [changes, check]
    if: needs.changes.outputs.browser_postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc-ci-only
          POSTGRES_DB: grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Fetch the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: e2e-web

      - name: Browser tests on PostgreSQL 17
        run: npm run test:e2e -- --only 01-smoke,16-records,23-portal
        env:
          E2E_WEB_DIST: ${{ github.workspace }}/e2e-web
          # The account may create databases; each run makes its own and drops it (tools/e2e/lib/instance.mjs).
          E2E_DATABASE_URL: postgres://grc:grc-ci-only@127.0.0.1:5432/grc

      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-output-postgres
          path: tools/e2e/out

  accessibility:
    # The accessibility audit: every page on a full run, the affected areas' pages otherwise.
    name: Accessibility audit
    needs: [changes, check]
    if: needs.changes.outputs.accessibility == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Fetch the web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: e2e-web

      - name: Accessibility audit
        run: npm run test:a11y -- --quick
        env:
          E2E_WEB_DIST: ${{ github.workspace }}/e2e-web
          # Empty on a full run (every page); otherwise the affected areas (tools/e2e/lib/routes.mjs).
          E2E_AREAS: ${{ needs.changes.outputs.areas }}

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-output
          path: tools/a11y/out

  api-client:
    # Fails when packages/api-client/src/schema.ts would change: run
    # `npx tsx packages/api-client/generate.ts` and commit the result. Whenever server code changes.
    name: API client up to date
    needs: changes
    if: needs.changes.outputs.api_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: API client is up to date with the server's OpenAPI description
        run: npx tsx packages/api-client/generate.ts --check

  mobile:
    # The mobile app (mobile/, E38-01): on Linux the typecheck, Jest and an Android release build (an
    # unsigned APK, kept as an artifact: sign it with the release key kept outside the repository,
    # docs/mobile.md); on macOS an unsigned iPhone build for the simulator and for devices. No paid
    # build service, no signing secrets, nothing sent anywhere (telemetry off). When mobile/,
    # packages/api-client/ or shared/ change; nightly and on tags.
    name: Mobile app (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/node-version.txt
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install the app's packages
        working-directory: mobile
        # The registry sometimes drops a connection on the macOS runners: retry, then try the whole install once more.
        env:
          npm_config_fetch_retries: '5'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
        run: npm ci --no-audit --no-fund || npm ci --no-audit --no-fund

      - name: Type check
        if: matrix.platform == 'android'
        working-directory: mobile
        run: npm run typecheck

      - name: Tests (Jest, React Native Testing Library)
        if: matrix.platform == 'android'
        working-directory: mobile
        run: npm test -- --ci

      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the native project
        working-directory: mobile
        run: npx expo prebuild --platform ${{ matrix.platform }} --no-install

      - name: Android release build (unsigned APK)
        if: matrix.platform == 'android'
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Keep the unsigned APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandpiper-grc-android-unsigned
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Install the iPhone project's pods
        if: matrix.platform == 'ios'
        working-directory: mobile/ios
        run: pod install

      - name: iPhone build for the simulator (unsigned)
        if: matrix.platform == 'ios'
        working-directory: mobile/ios
        run: >
          xcodebuild -workspace SandpiperGRC.xcworkspace -scheme SandpiperGRC -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build

      - name: iPhone build for devices (unsigned)
        if: matrix.platform == 'ios'
        working-directory: mobile/ios
        run: >
          xcodebuild -workspace SandpiperGRC.xcworkspace -scheme SandpiperGRC -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

  result:
    # The one check branch protection should require. A job skipped because the change does not
    # need it counts as passed; a failed or cancelled one fails this.
    name: CI result
    needs: [changes, check, unit, database-server, released-migrations, unix-install, windows-install, container, browser, browser-postgres, accessibility, api-client, mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | node -e '
            const needs = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const bad = Object.entries(needs).filter(([, j]) => !["success", "skipped"].includes(j.result));
            for (const [name, j] of Object.entries(needs)) console.log(`${j.result.padEnd(9)} ${name}`);
            if (bad.length) { console.log(`Failed: ${bad.map(([n]) => n).join(", ")}`); process.exit(1); }
          '
