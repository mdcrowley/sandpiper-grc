name: CI

# Type check, tests and a production build of the web application, on every push and
# pull request; the tests again through the PostgreSQL server driver; installation on macOS
# and Linux with tools/install-node.sh and grc.sh; the container image, built and started,
# and compose.yaml run with both databases; the browser suite. On pushes to main and on
# version tags, once the checks pass, the image is published to ghcr.io for amd64 and arm64, with a
# software bill of materials and signed build provenance. The dependency audit fails only on a
# vulnerability someone can fix; a released migration may never change.
# Nothing here needs the private seed/ folder or any secret other than the built-in token.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Tests use an in-memory database and never read seed/; point at a folder that does not exist to prove it.
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # The major version is pinned in one place, shared with tools/install-node.ps1.
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        # Installs exactly what the committed lock file says.
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        # Fails on a known high or critical vulnerability in a production package when a fixed
        # version exists; one that nobody can fix yet is listed without failing (E16-13). Exit 3
        # means the registry could not be reached, which is a warning here.
        shell: bash
        run: |
          code=0
          npx tsx server/src/cli.ts audit-deps || code=$?
          if [ "$code" = 3 ]; then echo "::warning::The dependency audit could not reach the npm registry."; exit 0; fi
          exit $code

      - name: Type check (server and web)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the web application
        run: npm run build

  # The whole test suite through the PostgreSQL server driver (pg), so both drivers stay
  # interchangeable (E16-05):
  # - pglite-socket: every test database is an embedded PostgreSQL served over the wire protocol
  # - postgres-17: every test database is a fresh database on a real PostgreSQL server
  database-server:
    name: Tests on a database server (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [pglite-socket, postgres-17]
    services:
      postgres:
        # Started for both legs (a service cannot be made conditional); only postgres-17 uses it.
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: grc
          POSTGRES_PASSWORD: grc-ci-only
          POSTGRES_DB: grc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grc -d grc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
      GRC_DATABASE_POOL_MAX: '5'
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Tests through the wire protocol (pglite-socket)
        if: matrix.target == 'pglite-socket'
        env:
          GRC_TEST_DATABASE: pg
        run: npm test

      - name: Tests on PostgreSQL 17
        if: matrix.target == 'postgres-17'
        env:
          # The account creates and drops one database per test application.
          GRC_TEST_DATABASE_URL: postgres://grc:grc-ci-only@127.0.0.1:5432/grc
        run: npm test

      - name: Least-privilege database role (owner migrates, the server runs as grc_app)
        # E16-31 on a real server: the owner account creates the schema and grants grc_app, which
        # may read and write rows but cannot alter the schema or the audit log's trigger.
        # Not yet failing the workflow: remove continue-on-error after its first green run.
        if: matrix.target == 'postgres-17'
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGUSER: grc
          PGPASSWORD: grc-ci-only
          GRC_DATA_DIR: ${{ runner.temp }}/grc-lp
          GRC_PORT: '8171'
          GRC_DATABASE_SSL: 'off'
          GRC_DATABASE_URL: postgres://grc_app:app-ci-only@127.0.0.1:5432/grc_lp
        run: |
          set -eu
          psql -d grc -v ON_ERROR_STOP=1 -c "create database grc_lp" -c "create role grc_app login password 'app-ci-only'"
          GRC_DATABASE_MIGRATE_URL=postgres://grc:grc-ci-only@127.0.0.1:5432/grc_lp npx tsx server/src/cli.ts migrate
          npx tsx server/src/main.ts > "$RUNNER_TEMP/lp.out" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8171/api/health && break; sleep 2; done
          curl -fsS -X POST -H 'content-type: application/json' -H 'x-grc-csrf: 1' \
            -d '{"username":"admin","email":"admin@example.test","displayName":"Administrator","password":"ci-only-Passw0rd-long-enough"}' \
            http://127.0.0.1:8171/api/setup > /dev/null
          if PGUSER=grc_app PGPASSWORD=app-ci-only psql -d grc_lp -c "drop trigger audit_events_no_change on audit_events"; then echo "grc_app could drop the audit trigger"; exit 1; fi
          if PGUSER=grc_app PGPASSWORD=app-ci-only psql -d grc_lp -c "delete from audit_events"; then echo "grc_app could delete audit events"; exit 1; fi
          cat "$RUNNER_TEMP/lp.out"
          if grep -i 'permission denied\|must be owner' "$GRC_DATA_DIR/logs/grc.log"; then echo "the server needed owner rights at run time"; exit 1; fi
          touch "$GRC_DATA_DIR/grc.stop"

  # A migration that is part of a release must never change (E16-20): installations have applied
  # it and would not run it again. Compared with the newest version tag; before the first release
  # there is nothing to compare with.
  released-migrations:
    name: Released migrations unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out (with tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare with the newest release
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No release tag yet, so no migration is released."; exit 0; fi
          changed=$(git diff --name-only --diff-filter=MDR "$tag" HEAD -- ':(glob)server/src/**/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "::error::Migrations released in $tag were changed, renamed or deleted. Put the change in a new migration instead:"
            echo "$changed"
            exit 1
          fi
          echo "Every migration released in $tag is unchanged."

  # macOS and Linux installation as a person would do it: the pinned Node.js fetched by
  # tools/install-node.sh, then grc.sh for everything (the counterpart of grc.ps1).
  unix-install:
    name: Install and run with grc.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GRC_SEED_DIR: ${{ github.workspace }}/no-seed-folder
      GRC_DATA_DIR: ${{ github.workspace }}/../grc-data
      GRC_BACKUP_DIR: ${{ github.workspace }}/../grc-backups
      GRC_PORT: '8170'
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch the pinned Node.js into .tools/node (checksum verified)
        run: ./tools/install-node.sh

      - name: Install packages
        run: ./grc.sh install

      - name: Local continuous integration (typecheck, tests, tests on UTC, web build)
        run: ./grc.sh ci

      - name: Start, health, sample data, backup, stop
        run: |
          set -eu
          ./grc.sh start
          ./grc.sh health
          ./grc.sh seed --profile dev
          ./grc.sh backup --prune 2
          ./grc.sh verify-backup
          ./grc.sh status
          ./grc.sh version
          ./grc.sh logs --lines 20
          test -s "$GRC_DATA_DIR/logs/grc.log"
          ./grc.sh stop
          if ./grc.sh health; then echo "still answering after stop"; exit 1; fi

      - name: Service definitions are valid (systemd unit, launchd agent)
        run: |
          set -eu
          if [ "$(uname -s)" = Linux ]; then
            ./grc.sh service print > "$RUNNER_TEMP/sandpiper-grc.service"
            systemd-analyze verify "$RUNNER_TEMP/sandpiper-grc.service"
          else
            ./grc.sh service print > "$RUNNER_TEMP/org.sandpiper-grc.server.plist"
            plutil -lint "$RUNNER_TEMP/org.sandpiper-grc.server.plist" deploy/launchd/*.plist
          fi

      - name: Server logs
        if: failure()
        run: ./grc.sh logs --lines 200 || true

  # Builds the container image and proves it starts and answers its health check (E16-06), then
  # runs compose.yaml as the quick start describes, with the embedded database and with PostgreSQL.
  container:
    name: Container image and compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Node.js major version
        id: node
        run: echo "major=$(head -n 1 tools/node-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: sandpiper-grc:ci
          build-args: |
            NODE_MAJOR=${{ steps.node.outputs.major }}
            GRC_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,scope=ci-amd64,mode=max

      - name: Only the application is in the image
        run: |
          set -eu
          # /app holds exactly these; anything else (data, seed files, notes, tools) is a leak.
          top=$(docker run --rm --entrypoint sh sandpiper-grc:ci -c 'ls -A /app' | tr '\n' ' ')
          [ "$top" = "deploy dist node_modules package.json server " ] || { echo "Unexpected /app contents: $top"; exit 1; }
          found=$(docker run --rm --entrypoint sh sandpiper-grc:ci -c '
            find /app/server -name "*.test.ts" 2>/dev/null
            find /var/lib/sandpiper /var/lib/sandpiper-key -mindepth 1 2>/dev/null
            find /app -path /app/node_modules -prune -o \( -name "*.pem" -o -name "*.key" -o -name ".env*" \) -print 2>/dev/null
          ' || true)
          if [ -n "$found" ]; then echo "Unexpected files in the image:"; echo "$found"; exit 1; fi

      - name: Start (embedded database, read-only root filesystem)
        run: |
          docker run -d --name grc --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e GRC_ALLOW_INSECURE=1 -v grc-ci-data:/var/lib/sandpiper -v grc-ci-key:/var/lib/sandpiper-key \
            -p 127.0.0.1:8080:8080 sandpiper-grc:ci

      - name: Health check answers
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'; then echo "health ok"; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' grc)" != "true" ]; then docker logs grc; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root"' || { echo "web application not served"; exit 1; }
          # The image's own HEALTHCHECK must turn healthy too.
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' grc)" = healthy ] && break
            sleep 3
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' grc)" = healthy ] || { docker inspect --format '{{json .State.Health}}' grc; exit 1; }
          # The secret key was generated in its own volume, not in the data volume.
          docker exec grc sh -c 'test -s /var/lib/sandpiper-key/secret.key && ! ls /var/lib/sandpiper/*.key /var/lib/sandpiper/data/*.key 2>/dev/null'
          docker exec grc grc status
          # The version and commit, and the server's own log in the data volume.
          docker exec grc grc version | grep -q "${{ github.sha }}"
          docker exec grc grc logs --lines 5
          docker logs grc 2>&1 | grep -q '"msg":"Sandpiper GRC'

      - name: Refuses plain HTTP on every interface without GRC_ALLOW_INSECURE
        run: |
          if docker run --rm sandpiper-grc:ci; then echo "should have refused"; exit 1; fi
          docker run --rm sandpiper-grc:ci 2>&1 | grep -q 'Refusing to serve plain HTTP'

      - name: Stops cleanly
        if: always()
        run: |
          docker logs grc || true
          docker stop -t 30 grc || true
          docker rm grc || true

      - name: Compose quick start (embedded database), setup and sample data
        env:
          GRC_IMAGE: sandpiper-grc:ci
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 180
          curl -fsS -X POST -H 'content-type: application/json' -H 'x-grc-csrf: 1' \
            -d '{"username":"admin","email":"admin@example.test","displayName":"Administrator","password":"ci-only-Passw0rd-long-enough"}' \
            http://127.0.0.1:8080/api/setup > /dev/null
          docker compose stop app
          docker compose run --rm --no-deps app grc seed --profile dev
          docker compose up -d --wait --wait-timeout 180
          docker compose exec app grc status
          docker compose stop app
          docker compose run --rm --no-deps app grc backup
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          docker compose down -v

      - name: Compose with PostgreSQL
        env:
          GRC_IMAGE: sandpiper-grc:ci
        run: |
          set -eu
          openssl rand -hex 24 > deploy/secrets/db_password.txt
          docker compose -f compose.yaml -f compose.postgres.yaml up -d --wait --wait-timeout 240
          docker compose -f compose.yaml -f compose.postgres.yaml logs app | grep -q 'PostgreSQL server'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok":true'
          docker compose -f compose.yaml -f compose.postgres.yaml down -v

      - name: Compose logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.postgres.yaml logs || true

  # Publishes the image for linux/amd64 and linux/arm64 to the GitHub Container Registry, once the
  # checks have passed: "edge" for every push to main; x.y.z, x.y and latest for a version tag vX.Y.Z.
  publish:
    name: Publish the container image
    needs: [check, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Signed build provenance (attestations), recorded with GitHub's own signing service.
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Node.js major version
        id: node
        run: echo "major=$(head -n 1 tools/node-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (to build for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Sandpiper GRC
            org.opencontainers.image.description=Governance, risk and compliance for transit organizations
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=Governance, risk and compliance for transit organizations
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A software bill of materials and full build provenance, attached to the image.
          sbom: true
          provenance: mode=max
          build-args: |
            NODE_MAJOR=${{ steps.node.outputs.major }}
            GRC_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  browser:
    name: Browser tests and accessibility (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: tools/node-version.txt
          cache: npm

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Build the web application
        run: npm run build
        env:
          GRC_WEB_DIST: ${{ github.workspace }}/e2e-web

      - name: Browser tests (every route, every role, every record type, keyboard)
        run: npm run test:e2e
        env:
          E2E_WEB_DIST: ${{ github.workspace }}/e2e-web

      - name: Accessibility audit
        run: npm run test:a11y -- --quick
        env:
          E2E_WEB_DIST: ${{ github.workspace }}/e2e-web

      - name: Keep the logs and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            tools/e2e/out
            tools/a11y/out
