# Weekly update proposals (GitHub Actions are pinned to commit SHAs with the version in a comment,
# which Dependabot keeps up to date), grouped so that routine updates arrive as a few pull requests
# rather than one per package. Major versions are proposed separately, one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # PGlite (production) and its test bridge pglite-socket (development) pin each other's exact
      # versions, so they must move in one pull request; this group comes first and takes them.
      pglite:
        patterns: ['@electric-sql/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    groups:
      actions:
        patterns: ['*']

  # Base images are pinned by digest (Dockerfile, compose.postgres.yaml); these propose the new
  # digest, keeping the tag beside it. The Node.js and PostgreSQL major versions change by hand
  # (Node.js together with tools/node-version.txt), so major updates are not proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
