# Sandpiper GRC with Docker Compose (or Podman Compose). See docs/docker.md.
#
# Quick start, from this folder:
#   docker compose up -d
# then open http://127.0.0.1:8080 and complete the setup wizard.
#
# With a PostgreSQL server instead of the embedded database (write the password to
# deploy/secrets/db_password.txt first; see compose.postgres.yaml):
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# Settings: copy .env.example to .env and edit it. Every GRC_* variable in .env reaches the
# application; the few that only steer this file (GRC_IMAGE, GRC_BIND, GRC_PUBLISH_PORT) are
# described there too.
#
# The application is published on 127.0.0.1:8080 over plain HTTP. To serve other people, put a
# reverse proxy that terminates HTTPS in front of it (docs/docker.md, "HTTPS").

name: sandpiper-grc

services:
  app:
    # The published image; if it cannot be pulled, Compose builds it from this folder.
    # GRC_IMAGE=sandpiper-grc:local with `docker compose up -d --build` always builds locally.
    image: ${GRC_IMAGE:-ghcr.io/mdcrowley/sandpiper-grc:latest}
    build:
      context: .
    restart: unless-stopped
    # The server takes up to 20 seconds to finish requests and close the database cleanly.
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${GRC_BIND:-127.0.0.1}:${GRC_PUBLISH_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # The secret key file lives in its own volume, never in the data volume, so a copy or
      # backup of the data holds no key. It is generated on first start. To supply your own,
      # set GRC_SECRET_KEY in .env, or point GRC_SECRET_KEY_FILE at a mounted secret.
      GRC_SECRET_KEY_FILE: ${GRC_SECRET_KEY_FILE:-/var/lib/sandpiper-key/secret.key}
      # Inside the container the server listens on every interface of its own network, so it
      # must be told that HTTPS is handled in front of it. Remove this when you set GRC_TLS_CERT/KEY.
      GRC_ALLOW_INSECURE: "1"
      # Whose X-Forwarded-For/-Proto the application believes. "gateway" is the Docker host itself,
      # where a reverse proxy in front of the published port connects from; nobody else (people on
      # your network have private addresses too, and must not choose the address recorded for them).
      # A proxy in another container: its own address. No proxy at all: set it to off.
      GRC_TRUST_PROXY: ${GRC_TRUST_PROXY:-gateway}
    volumes:
      - grc-data:/var/lib/sandpiper
      - grc-key:/var/lib/sandpiper-key
    healthcheck:
      test: ["CMD", "node", "deploy/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s

volumes:
  # Data: the embedded database, attached files and backups.
  grc-data:
  # The secret key that encrypts authenticator keys and other stored secrets. Back it up
  # separately from the data (docs/docker.md, "Secret key").
  grc-key:
